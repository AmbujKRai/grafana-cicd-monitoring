# Prometheus configuration used by docker-compose.yml (service names instead of localhost).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: grafana-cicd-monitoring

rule_files:
  - rules/*.yml

scrape_configs:
  - job_name: cicd-exporter
    static_configs:
      - targets: ["exporter:9200"]
        labels:
          ci_system: github-actions

  # Optional: a Jenkins running on the Docker host (see monitoring/jenkins)
  - job_name: jenkins
    metrics_path: /prometheus/
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels:
          ci_system: jenkins

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
