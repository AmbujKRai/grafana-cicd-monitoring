apiVersion: 1

contactPoints:
  - orgId: 1
    name: cicd-webhook
    receivers:
      # The exporter's /alerts endpoint logs every notification and counts it as a metric.
      # Add email/Slack/Teams receivers here (or in the UI) for real notifications.
      - uid: cicd-webhook
        type: webhook
        disableResolveMessage: false
        settings:
          url: ${ALERT_WEBHOOK_URL}
          httpMethod: POST
          maxAlerts: "20"
