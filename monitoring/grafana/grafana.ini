# Grafana settings for the native (no Docker) setup, passed with --config.
# docker-compose.yml sets the same options through GF_* environment variables.
# Paths (data, logs, provisioning) are supplied by scripts/start-stack.ps1 via GF_PATHS_*.

[server]
http_addr = 127.0.0.1
http_port = 3000
root_url = http://localhost:3000/

[security]
admin_user = admin
# admin_password is read from GF_SECURITY_ADMIN_PASSWORD (.env), default "admin"
disable_gravatar = true
cookie_samesite = lax

[auth.anonymous]
# Read-only dashboards without logging in on the local demo machine.
# Editing, Explore and alert management still require the admin login.
enabled = true
org_name = Main Org.
org_role = Viewer

[users]
allow_sign_up = false
default_theme = dark

[dashboards]
min_refresh_interval = 5s

[plugins]
# Grafana 13 ships its core data sources as separate plugins that are installed from grafana.com
# on first start and each run as their own process (~55 MB). This stack only queries Prometheus:
# install that one (pinned, before provisioning runs) and skip loading/installing the rest.
preinstall_sync = prometheus@13.2.3
preinstall_auto_update = false
disable_plugins = elasticsearch,grafana-postgresql-datasource,influxdb,jaeger,loki,mssql,mysql,opentsdb,zipkin,grafana-pyroscope-datasource,stackdriver,tempo,cloudwatch,grafana-azure-monitor-datasource,graphite,grafana-lokiexplore-app,grafana-pyroscope-app,grafana-exploretraces-app,grafana-metricsdrilldown-app,grafana-advisor-app

[unified_alerting]
enabled = true
min_interval = 10s

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[log]
mode = console file
level = info
