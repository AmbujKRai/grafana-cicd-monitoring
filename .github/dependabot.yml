version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      app-dependencies:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/monitoring/exporter"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directories: ["/", "/monitoring/exporter"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
