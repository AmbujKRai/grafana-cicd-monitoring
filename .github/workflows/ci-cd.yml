name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      simulate_slow_build:
        description: "Add a 150 s delay to the test stage (performance-regression demo)"
        type: boolean
        default: false

# Least privilege by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  # Trivy is pinned to a release and verified by checksum (see the March 2026
  # trivy-action tag-hijack incident) instead of using a mutable action tag.
  TRIVY_VERSION: "0.75.0"
  TRIVY_SHA256: "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install tools
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: |
          mkdir -p reports
          ruff check . --output-format=json > reports/ruff.json || true
          ruff check . --output-format=github
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lint-report
          path: reports/
          retention-days: 7

  test:
    name: Unit Tests & Coverage
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            monitoring/exporter/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt -r monitoring/exporter/requirements.txt
      - name: Simulated slow integration tests
        if: ${{ inputs.simulate_slow_build }}
        run: |
          echo "::warning::Simulating a performance regression (+150 s)"
          sleep 150
      - name: App tests with coverage gate (80%)
        run: pytest --junitxml=reports/junit.xml --cov=app --cov-report=xml:reports/coverage.xml --cov-report=term-missing
      - name: Exporter tests
        working-directory: monitoring/exporter
        run: python -m pytest tests -q
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-reports
          path: reports/
          retention-days: 7

  security:
    name: Security Scan (SAST + SCA)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install tools
        run: pip install -r requirements-dev.txt
      - name: Bandit (static analysis)
        run: |
          mkdir -p reports
          bandit -r app -f json -o reports/bandit.json --exit-zero
      - name: pip-audit (dependency vulnerabilities)
        run: pip-audit -r requirements.txt -f json -o reports/pip-audit.json || true
      - name: Security gate
        run: python ci/security_gate.py --bandit reports/bandit.json --pip-audit reports/pip-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-reports
          path: reports/
          retention-days: 7

  build:
    name: Build & Scan Image
    needs: [test, security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name
        id: meta
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"
          echo "image=${repo}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Docker build
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$IMAGE" .
          mkdir -p reports
          size=$(docker image inspect "$IMAGE" --format '{{.Size}}')
          printf '{"image": "%s", "size_bytes": %s}\n' "$IMAGE" "$size" > reports/image.json
          cat reports/image.json
      - name: Install Trivy (pinned, checksum verified)
        run: |
          curl -sSfL -o trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum --check --strict
          tar -xzf trivy.tgz trivy
          sudo mv trivy /usr/local/bin/trivy
          trivy --version
      - name: Trivy image scan
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          trivy image --quiet --format json --output reports/trivy.json "$IMAGE"
          trivy image --quiet --skip-db-update --severity HIGH,CRITICAL --format table "$IMAGE"
      - name: Container security gate
        run: python3 ci/security_gate.py --trivy reports/trivy.json
      - name: Push image to GHCR
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          REPO: ${{ steps.meta.outputs.repo }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker tag "$IMAGE" "${REPO}:latest"
          docker push "$IMAGE"
          docker push "${REPO}:latest"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: build-reports
          path: reports/
          retention-days: 7

  deploy-staging:
    name: Deploy to Staging
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start release candidate
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker run -d --name taskflow-staging -p 8000:8000 -e APP_ENV=staging "$IMAGE"
      - name: Smoke test
        run: python3 ci/smoke_test.py --base-url http://localhost:8000 --timeout 60
      - name: Container logs
        if: always()
        run: docker logs taskflow-staging || true
      - name: Tear down
        if: always()
        run: docker rm -f taskflow-staging || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: deploy-reports
          path: reports/
          retention-days: 7

  publish-metrics:
    name: Publish Build Metrics
    needs: [lint, test, security, build, deploy-staging]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Collect build metrics
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 ci/collect_metrics.py --reports artifacts --out build-metrics.json
      - name: Publish to ci-metrics branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ci/publish_metrics.sh build-metrics.json
